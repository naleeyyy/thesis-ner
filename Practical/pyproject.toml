[project]
name = "albanian-ner-practical"
version = "0.1.0"
description = "Practical work for the Albanian NER thesis: WikiANN-sq baselines + LLM-assisted annotation pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.60",
    "transformers>=4.44",
    "torch>=2.2",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "datasets>=2.20",
    "evaluate>=0.4.2",
    "seqeval>=1.2.2",
    "numpy>=1.26",
    "stanza>=1.8",
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
    "pandas>=2.2",
    "requests>=2.32",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
